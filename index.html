<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clarivo</title>
<style>
  :root { --ink:#1b2430; --sub:#5a6577; --line:#dfe3ea; --bg:#f7f8fb; --accent:#3454d1; --warn:#b4540a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; line-height:1.5; }
  main { max-width:720px; margin:0 auto; padding:2.5rem 1.25rem 4rem; }
  h1 { margin:0; font-size:2rem; letter-spacing:-.02em; }
  .tag { color:var(--sub); margin:.25rem 0 1.75rem; }
  .drop { background:#fff; border:2px dashed var(--line); border-radius:8px; padding:1.5rem; text-align:center; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:.7rem 1.4rem; font-size:1rem; cursor:pointer; margin-top:1rem; }
  button:disabled { opacity:.5; cursor:wait; }
  #status { margin:1rem 0; color:var(--sub); }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:1rem 1.25rem; margin-bottom:1rem; }
  .card h2 { margin:0 0 .5rem; font-size:1rem; }
  .card.warn { border-left:4px solid var(--warn); }
  .card.act { border-left:4px solid var(--accent); }
  ul { margin:0; padding-left:1.2rem; }
  li { margin-bottom:.35rem; }
  .pill { font-size:.72rem; font-weight:600; text-transform:uppercase; padding:.1rem .45rem; border-radius:99px; background:#e9edfb; color:var(--accent); margin-left:.4rem; }
  .pill.high { background:#fde8d7; color:var(--warn); }
  .date { font-weight:600; }
  .empty { color:var(--sub); font-style:italic; }
</style>
</head>
<body>
<main>
  <h1>Clarivo</h1>
  <p class="tag">From confusion to clear action. Upload any confusing document.</p>

  <div class="drop">
    <input type="file" id="file" accept="image/*,application/pdf">
    <br><button id="go" onclick="run()">Make it clear</button>
  </div>
  <div id="status"></div>
  <div id="out"></div>
</main>

<script>
const $ = id => document.getElementById(id);

function card(title, cls, items, build) {
  const c = document.createElement('div');
  c.className = 'card ' + (cls || '');
  const h = document.createElement('h2');
  h.textContent = title;
  c.appendChild(h);
  if (!items || !items.length) {
    const p = document.createElement('p');
    p.className = 'empty';
    p.textContent = 'Nothing found in this document.';
    c.appendChild(p);
  } else {
    const ul = document.createElement('ul');
    items.forEach(it => { const li = document.createElement('li'); build(li, it); ul.appendChild(li); });
    c.appendChild(ul);
  }
  return c;
}

function render(d) {
  const out = $('out');
  out.innerHTML = '';
  const head = document.createElement('div');
  head.className = 'card';
  const t = document.createElement('h2'); t.textContent = d.title || 'Your document';
  const s = document.createElement('p'); s.textContent = d.summary || '';
  head.append(t, s);
  out.appendChild(head);

  out.appendChild(card('What to do', 'act', d.actions, (li, a) => {
    li.textContent = a.task || a;
    if (a.priority) { const p = document.createElement('span'); p.className = 'pill ' + a.priority; p.textContent = a.priority; li.appendChild(p); }
  }));
  out.appendChild(card('Deadlines', '', d.deadlines, (li, x) => {
    const b = document.createElement('span'); b.className = 'date'; b.textContent = x.date || '';
    li.append(b, ' - ' + (x.what || ''));
  }));
  out.appendChild(card('Documents to prepare', '', d.required_documents, (li, x) => { li.textContent = x; }));
  out.appendChild(card('Watch out', 'warn', d.warnings, (li, x) => { li.textContent = x; }));
}

async function run() {
  const f = $('file').files[0];
  if (!f) { $('status').textContent = 'Choose a file first.'; return; }
  $('go').disabled = true;
  $('out').innerHTML = '';
  $('status').textContent = 'Reading your document...';
  const fd = new FormData();
  fd.append('file', f);
  try {
    const r = await fetch('/analyze', { method: 'POST', body: fd });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || 'Request failed');
    if (d.error) throw new Error(d.error);
    $('status').textContent = '';
    render(d);
  } catch (e) {
    $('status').textContent = 'Something went wrong: ' + e.message;
  } finally {
    $('go').disabled = false;
  }
}
</script>
</body>
</html>
